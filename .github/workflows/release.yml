name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Build
        run: npm run build:release

      - name: Package executables
        run: npm run package

      - name: Archive macOS binaries
        run: |
          tar -czf dist/gjallarhorn-macos-x64.tar.gz -C dist gjallarhorn-macos-x64
          tar -czf dist/gjallarhorn-macos-arm64.tar.gz -C dist gjallarhorn-macos-arm64
          rm dist/gjallarhorn-macos-x64 dist/gjallarhorn-macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
